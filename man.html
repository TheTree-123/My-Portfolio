    <script>
        // Audio Synth Engine - Slow, atmospheric Deltarune Piano ("man.ogg" waltz)

            constructor() {
                this.ctx = null;
                this.isMuted = true;
                this.initialized = false;
                this.bgmTimeout = null;
                this.activeOscillators = [];
            }

            init() {
                if (this.initialized) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.initialized = true;
                } catch (e) {
                    console.warn("AudioContext failed:", e);
                }
            }

            toggleSound() {
                if (!this.initialized) this.init();

                this.isMuted = !this.isMuted;
                if (!this.isMuted) {
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    this.startWaltzLoop();
                } else {
                    this.stopWaltzLoop();
                }
                return !this.isMuted;
            }

            playTextBlip() {
                if (this.isMuted || !this.ctx || this.ctx.state !== 'running') return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160 + Math.random() * 25, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }

            playSelectSound() {
                if (this.isMuted || !this.ctx || this.ctx.state !== 'running') return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.05); // E5

                gain.gain.setValueAtTime(0.10, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            // Warm felt piano synthesis replacing harsh organ sounds
            playPianoNote(freq, time, duration = 1.2, volume = 0.08) {
                if (!this.ctx || this.isMuted || this.ctx.state !== 'running') return;
                
                const oscPrimary = this.ctx.createOscillator();
                const oscHarmonic = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                // Pure sine waves with subtle fundamental triangle tone for acoustic warmth
                oscPrimary.type = 'sine';
                oscHarmonic.type = 'triangle';
                
                oscPrimary.frequency.setValueAtTime(freq, time);
                oscHarmonic.frequency.setValueAtTime(freq * 2, time);

                // Warm lowpass felt filter
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, time);
                filter.frequency.exponentialRampToValueAtTime(220, time + duration);

                // Gentle piano velocity envelope
                gain.gain.setValueAtTime(0.0001, time);
                gain.gain.linearRampToValueAtTime(volume, time + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.00001, time + duration);

                oscPrimary.connect(filter);
                oscHarmonic.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                oscPrimary.start(time);
                oscHarmonic.start(time);
                oscPrimary.stop(time + duration);
                oscHarmonic.stop(time + duration);

                this.activeOscillators.push(oscPrimary, oscHarmonic);
                setTimeout(() => {
                    this.activeOscillators = this.activeOscillators.filter(o => o !== oscPrimary && o !== oscHarmonic);
                }, (time - this.ctx.currentTime + duration) * 1000);
            }

                    { f: 659.25, t: 32, d: 1.0, v: 0.09 }, // E5
                    { f: 698.46, t: 33, d: 2.5, v: 0.09 }, // F5

                    { f: 587.33, t: 37, d: 1.0, v: 0.09 }, // D5
                    { f: 554.37, t: 38, d: 1.0, v: 0.09 }, // C#5
                    { f: 880.00, t: 39, d: 1.0, v: 0.09 }, // A5
                    { f: 659.25, t: 40, d: 1.0, v: 0.09 }, // E5
                    { f: 783.99, t: 41, d: 1.0, v: 0.09 }, // G5
                    { f: 698.46, t: 42, d: 1.0, v: 0.09 }, // F5
                    { f: 659.25, t: 43, d: 1.0, v: 0.09 }, // E5
                    { f: 698.46, t: 44, d: 2.5, v: 0.09 }  // F5
                ];

                const loopDuration = 48 * step;

                const playLoop = () => {
                    if (this.isMuted || !this.ctx) return;
                    const now = this.ctx.currentTime;

                    waltzNotes.forEach(n => {
                        this.playPianoNote(n.f, now + n.t * step, n.d * step, n.v || 0.07);
                    });

                    this.bgmTimeout = setTimeout(playLoop, loopDuration * 1000);
                };

                playLoop();
            }

            stopWaltzLoop() {
                if (this.bgmTimeout) {
                    clearTimeout(this.bgmTimeout);
                    this.bgmTimeout = null;
                }
                this.activeOscillators.forEach(osc => {
                    try {
                        osc.stop();
                        osc.disconnect();
                    } catch (e) {}
                });
                this.activeOscillators = [];
                if (this.ctx && this.ctx.state === 'running') {
                    this.ctx.suspend();
                }
            }
        }

        const audio = new DeltaruneAudio();

        // Expanded Dialogue Tree with full routing integrity
        let hasEgg = false;

        const storyNodes = {
            // Initial Encounter
            start: {
                speaker: "Narrator",
                status: "Behind the Tree",
                portrait: "🌳",
                text: "Well, there is a man behind the tree.\n\nHe is standing quietly in the dark.",
                choices: [
                    { text: "[ Speak to the man ]", next: "speakIntro" },
                    { text: "[ Step away ]", next: "finish" }
                ]
            },

            // Conversation Intro
            speakIntro: {
                speaker: "The Man",
                status: "Standing behind the tree",
                portrait: "👤",
                text: "Ah... You stepped off the main path.\n\nNot many wander behind this tree.\n\nIt is very quiet here.",
                choices: [
                    { text: "Who are you?", next: "whoAreYou" },
                    { text: "Where are we?", next: "whereAreWe" },
                    { text: "Why are you behind the tree?", next: "whyBackHere" },
                    { text: "[ Is he offering something? ]", next: "offerPrompt" }
                ]
            },

            whereAreWe: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "Is this a Dark World? A room between rooms?\n\nPerhaps it is nowhere at all.\n\nYet the piano plays on in 3/4 time.",
                choices: [
                    { text: "Who are you?", next: "whoAreYou" },
                    { text: "Why are you here?", next: "whyBackHere" },
                    { text: "[ Is he offering something? ]", next: "offerPrompt" }
                ]
            },

            whoAreYou: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "I am just a man standing behind a tree.\n\nSometimes things exist simply because someone paused to look for them.",
                choices: [
                    { text: "Are you lonely?", next: "lonelyLayer" },
                    { text: "Are you so far gone?", next: "soFarGone" },
                    { text: "[ Is he offering something? ]", next: "offerPrompt" }
                ]
            },

            whyBackHere: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "Behind the tree, there are no battles, no noise, and no hurry.\n\nIt is a peaceful place to rest.",
                choices: [
                    { text: "You seem so far gone...", next: "soFarGone" },
                    { text: "Can I stay a while?", next: "stayAWhile" }
                ]
            },

            soFarGone: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "'So far gone...' Yes, that is a fitting way to put it.\n\nFar from the path... yet you found me anyway.",
                choices: [
                    { text: "Will you disappear?", next: "disappear" },
                    { text: "Can I stay a while?", next: "stayAWhile" }
                ]
            },

            lonelyLayer: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "It was quiet at first. But when someone pauses under the tree... it feels warm.",
                choices: [
                    { text: "Can I stay a while?", next: "stayAWhile" },
                    { text: "[ Is he offering something? ]", next: "offerPrompt" }
                ]
            },

            stayAWhile: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "Take all the time you need.\n\nWe can listen to the music under the tree for as long as you like.",
                choices: [
                    { text: "[ Is he offering something? ]", next: "offerPrompt" },
                    { text: "Will you disappear when I leave?", next: "disappear" }
                ]
            },

            disappear: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "Perhaps. But as long as you remember the tree... I will be here.\n\nThank you for stopping to talk.",
                choices: [
                    { text: "[ Is he offering something? ]", next: "offerPrompt" },
                    { text: "[ Step away ]", next: "finish" }
                ]
            },

            // The Offer Node
            offerPrompt: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "Is he offering something?",
                choices: [
                    { text: "[ YES ]", next: "receiveEgg" },
                    { text: "[ NO ]", next: "refuseOffer" }
                ]
            },

            refuseOffer: {
                speaker: "The Man",
                status: "Behind the Tree",
                portrait: "👤",
                text: "He nods quietly and tucks it away.\n\n'That is alright. It will be right here if you need it.'",
                choices: [
                    { text: "[ Talk to him again ]", next: "speakIntro" },
                    { text: "[ Step away ]", next: "finish" }
                ]
            },

            receiveEgg: {
                speaker: "The Man",
                status: "Hands you an Egg 🥚",
                portrait: "🥚",
                text: "You received an Egg.\n\n(Not too important, not too unimportant.)\n\nHe is no longer behind the tree.",
                onEnter: () => { hasEgg = true; },
                choices: [
                    { text: "[ Examine the Egg ]", next: "examineEgg" },
                    { text: "[ Step away ]", next: "finish" }
                ]
            },

            examineEgg: {
                speaker: "Kris",
                status: "Carrying the Egg",
                portrait: "🥚",
                text: "Not too important, not too unimportant.\n\nIt rests comfortably in your pocket.",
                choices: [
                    { text: "[ Step away ]", next: "finish" }
                ]
            },

            alreadyVisited: {
                speaker: "Narrator",
                status: "The Lone Tree",
                portrait: "🌳",
                text: "Well, there was not a man here.\n\nNobody is behind the tree.",
                choices: [
                    { text: "[ Look closely anyway ]", next: "lookClosely" },
                    { text: "[ Step away ]", next: "finish" }
                ]
            },

            lookClosely: {
                speaker: "Narrator",
                status: "The Lone Tree",
                portrait: "🌳",
                text: "You feel a faint, comforting warmth in your pocket. The egg rests peacefully.",
                choices: [
                    { text: "[ Step away ]", next: "finish" }
                ]
            }
        };

        // Tree Image Fallback Logic
        function handleTreeImageError() {
            document.getElementById('tree-img').classList.add('hidden');
            document.getElementById('tree-fallback').classList.remove('hidden');
        }

        // Hover Tooltip tracking
        const treeWrapper = document.getElementById('tree-wrapper');
        const hoverTooltip = document.getElementById('hover-tooltip');

        treeWrapper.addEventListener('mousemove', (e) => {
            if (!isDialogueActive) {
                hoverTooltip.style.left = `${e.clientX}px`;
                hoverTooltip.style.top = `${e.clientY - 20}px`;
                hoverTooltip.classList.remove('opacity-0');
            }
        });

        treeWrapper.addEventListener('mouseleave', () => {
            hoverTooltip.classList.add('opacity-0');
        });

        // Dialogue System
        let isDialogueActive = false;
        let typingTimeout = null;

        const dialogueModal = document.getElementById('dialogue-modal');
        const dialogueTextEl = document.getElementById('dialogue-text');
        const speakerNameEl = document.getElementById('speaker-name');
        const speakerStatusEl = document.getElementById('speaker-status');
        const portraitIconEl = document.getElementById('portrait-icon');
        const choicesContainer = document.getElementById('choices-container');
        const initialHint = document.getElementById('initial-hint');

        treeWrapper.addEventListener('click', () => {
            if (!isDialogueActive) {
                openDialogue(hasEgg ? 'alreadyVisited' : 'start');
            }
        });

        function openDialogue(nodeKey) {
            isDialogueActive = true;
            hoverTooltip.classList.add('opacity-0');
            initialHint.classList.add('opacity-0');
            
            dialogueModal.classList.remove('translate-y-full', 'opacity-0');
            dialogueModal.classList.add('translate-y-0', 'opacity-100');

            audio.playSelectSound();
            renderNode(nodeKey);
        }

        function closeDialogue() {
            isDialogueActive = false;
            if (typingTimeout) clearTimeout(typingTimeout);

            dialogueModal.classList.add('translate-y-full', 'opacity-0');
            dialogueModal.classList.remove('translate-y-0', 'opacity-100');

            initialHint.classList.remove('opacity-0');
        }

        function renderNode(nodeKey) {
            const node = storyNodes[nodeKey];
            if (!node) return;

            if (node.onEnter) node.onEnter();

            speakerNameEl.textContent = node.speaker;
            speakerStatusEl.textContent = node.status;
            portraitIconEl.textContent = node.portrait || "👤";

            choicesContainer.innerHTML = '';
            dialogueTextEl.textContent = '';
            dialogueTextEl.classList.add('typing-cursor');

            const fullText = node.text;
            let charIndex = 0;

            if (typingTimeout) clearTimeout(typingTimeout);

            function typeNextChar() {
                if (charIndex < fullText.length) {
                    dialogueTextEl.textContent += fullText.charAt(charIndex);
                    charIndex++;
                    audio.playTextBlip();
                    typingTimeout = setTimeout(typeNextChar, 28);
                } else {
                    dialogueTextEl.classList.remove('typing-cursor');
                    renderChoices(node.choices);
                }
            }

            typeNextChar();
        }

        function renderChoices(choices) {
            choicesContainer.innerHTML = '';
            if (!choices) return;

            choices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = "deltarune-btn w-full text-left px-3 py-2 font-silkscreen text-xs sm:text-sm flex items-center space-x-2 group border border-transparent hover:border-yellow-300";
                
                btn.innerHTML = `
                    <span class="soul-heart opacity-0 group-hover:opacity-100 transition-opacity">♥</span>
                    <span class="text-white group-hover:text-yellow-300">${choice.text}</span>
                `;

                btn.addEventListener('mouseenter', () => audio.playSelectSound());
                btn.addEventListener('click', () => {
                    audio.playSelectSound();
                    if (choice.next === 'finish') {
                        closeDialogue();
                    } else {
                        renderNode(choice.next);
                    }
                });

                choicesContainer.appendChild(btn);
            });
        }

        document.getElementById('close-dialogue-btn').addEventListener('click', closeDialogue);

        // Audio Button Controls
        const audioToggleBtn = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');
        const audioText = document.getElementById('audio-text');

        audioToggleBtn.addEventListener('click', () => {
            const active = audio.toggleSound();
            if (active) {
                audioIcon.setAttribute('data-lucide', 'volume-2');
                audioIcon.classList.remove('text-red-500');
                audioIcon.classList.add('text-yellow-300');
                audioText.textContent = 'SOUND: ON';
            } else {
                audioIcon.setAttribute('data-lucide', 'volume-x');
                audioIcon.classList.remove('text-yellow-300');
                audioIcon.classList.add('text-red-500');
                audioText.textContent = 'SOUND: OFF';
            }
            lucide.createIcons();
        });

        window.onload = function() {
            lucide.createIcons();
        };
    </script>
</body>
